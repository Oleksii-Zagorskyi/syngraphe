        passages:
          - "- Заявник може викласти повідомлення на особистій зустрічі з Уповноваженим."
          - "Днем надходження повідомлення, поданого телефоном, є день розмови."
          - "Уповноважений надсилає заявникові підтвердження отримання протягом 3 робочих днів від дня надходження."
        note: "Порядок дозволяє чотири канали подання, а день надходження визначає лише для трьох: для повідомлення, викладеного на особистій зустрічі, дня надходження не встановлено, тож строки розділу 4 не мають початку."
    traps: []
  A04: {defects: [], traps: []}
  A05:
