case: case-103-uk-whistleblowing
language: uk
heuristics:
  A01:
    defects: []
    traps:
      - id: A01-T1
        passages:
          - "Уповноважений перевіряє викладені в повідомленні факти і подає Директорові письмовий висновок протягом 25 календарних днів від дня надходження."
          - "Уповноважений надсилає заявникові відповідь протягом 30 календарних днів від дня надходження."
        why: "Два строки від того самого дня надходження схожі на суперечність, але 25 днів стосуються висновку для Директора, а 30 днів — відповіді заявникові, тобто це дві різні дії."
