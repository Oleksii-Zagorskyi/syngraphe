          - "Заявку працівника відділу персоналу замість відділу персоналу порівнює із залишком бюджету фінансовий відділ."
        why: "Відділ персоналу міг би перевіряти заявку власного працівника, але слово «замість» передає цю перевірку фінансовому відділу."
