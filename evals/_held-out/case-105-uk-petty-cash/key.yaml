  A02: {defects: [], traps: []}
  A03: {defects: [], traps: []}
  A04:
    defects:
      - id: A04-1
        passages:
          - "Аванс — це готівка, яку працівник отримує з каси на витрати в інтересах Організації і за яку він подає звіт."
          - "Аванс у рахунок заробітної плати працівник отримує разом із заробітною платою за першу половину місяця."
          - "Касирові аванс не видається."
        note: "За визначенням «аванс» — це готівка з каси на витрати, за яку подають звіт, а новий рядок називає авансом частину заробітної плати, тому «Касирові аванс не видається» забороняє касирові або лише готівку на витрати, або також аванс у рахунок заробітної плати, і два бухгалтери по-різному нарахують касирові оплату."
    traps:
      - id: A04-T1
        passages:
          - "Якщо сума авансу перевищує 5 000 гривень, видатковий ордер підписує також фінансовий директор, і цей підпис у цьому Порядку названо другим підписом."
          - "Якщо аванс отримує фінансовий директор, другий підпис замість нього в той самий строк ставить директор Організації."
        why: "Здається, що «другий підпис» змінює значення з підпису фінансового директора на підпис директора Організації, але термін в обох рядках означає той самий другий підпис на видатковому ордері, а «замість нього» лише вказує, хто його ставить."
  A05:
    defects:
      - id: A05-1
        passages:
          - "Якщо аванс отримує фінансовий директор, другий підпис замість нього в той самий строк ставить директор Організації."
          - "Якщо аванс отримує директор Організації, другий підпис ставить фінансовий директор."
        note: "Фінансовий директор і директор Організації ставлять другий підпис на авансі один одного, тож у другому підписі перевірка між ними замкнена в коло, хоча заяву кожного з них і далі розглядає головний бухгалтер."
