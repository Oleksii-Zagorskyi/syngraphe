case: case-101-uk-remote-work
language: uk
heuristics:
  A01:
    defects:
      - id: A01-1
        passages:
          - "Працівник зазначає в заяві не більше трьох робочих днів на тиждень і період не довший за дванадцять місяців."
          - "Працівник може працювати дистанційно до чотирьох днів на тиждень."
        note: "Розділ 3 дозволяє зазначити в заяві не більше трьох днів на тиждень, а розділ 4 дозволяє працювати дистанційно до чотирьох днів, тож керівник, який виконує розділ 3, відхиляє заяву на чотири дні, яку розділ 4 дозволяє."
    traps: []
  A02:
    defects:
      - id: A02-1
        passages:
          - "Паперові службові документи з позначкою «Для службового користування» працівник не виносить із приміщень Організації."
          - "Інші паперові службові документи працівник зберігає вдома в шафі або скриньці, що замикається на ключ."
          - "Ці вимоги не поширюються на працівника, який працює дистанційно один день на тиждень."
        note: "«Ці вимоги» можна прочитати як обидві вимоги до паперових документів або лише як вимогу про шафу, тож один працівник, який працює дистанційно один день на тиждень, виносить документ із позначкою «Для службового користування» додому, а інший залишає його в приміщеннях Організації."
    traps:
      - id: A02-T1
        passages:
          - "Працівник повертає обладнання до відділу інформаційних технологій протягом пʼяти робочих днів після останнього дня дистанційної роботи."
          - "Працівник, якого звільняють, повертає обладнання не пізніше останнього дня роботи в Організації замість пʼятиденного строку."
        why: "До працівника, якого звільняють, застосовні два строки повернення обладнання, але слово «замість» прямо визначає, що діє останній день роботи в Організації."
  A03: {defects: [], traps: []}
  A04:
    defects:
      - id: A04-1
        passages:
          - "Службові документи в цій Політиці означають будь-які паперові та електронні документи, які працівник створив або отримав під час виконання трудових обовʼязків."
          - "Про втрату ноутбука або службового документа, тобто документа з позначкою «Для службового користування», працівник повідомляє фахівця з інформаційної безпеки протягом двох годин після виявлення."
        note: "Розділ 1 називає службовим документом будь-який документ, створений або отриманий під час виконання трудових обовʼязків, а правило про втрату звужує цей термін до документа з позначкою «Для службового користування», тож про втрату документа без позначки працівник повідомляє протягом двох годин за визначенням або не повідомляє взагалі за правилом про втрату."
    traps: []
  A05: {defects: [], traps: []}
  A06:
    defects: []
    traps:
      - id: A06-T1
        passages:
          - "Організація виплачує працівникові компенсацію витрат на інтернет та електроенергію в розмірі 900 гривень за календарний місяць."
          - "Бухгалтерія виплачує компенсацію разом із заробітною платою за другу половину місяця, за який її нараховано."
        why: "Перший рядок називає Організацію, а не посаду чи підрозділ, проте останній рядок того самого розділу покладає виплату компенсації на бухгалтерію."
residue:
  - id: R-1
    heuristic: A03
    passages:
      - "Працівник, який не завершив випробувальний строк або посада якого не входить до переліку, права на дистанційну роботу не має."
      - "Якщо директор вилучив посаду з переліку, відділ персоналу того самого дня письмово повідомляє про це працівника та його безпосереднього керівника."
      - "Дистанційна робота такого працівника завершується на десятий робочий день після дня повідомлення."
      - "Безпосередній керівник скасовує погодження, якщо відділ персоналу письмово підтвердив порушення працівником розділу 4 або розділу 7."
    confidence: 0.4
    note: "Працівник із погодженою заявою, якого перевели на посаду поза переліком, не має права за розділом 2, але Політика завершує дистанційну роботу лише в разі вилучення посади й скасовує погодження лише за порушення розділу 4 або розділу 7, тож не каже, чи й коли такий працівник припиняє дистанційну роботу."
  - id: R-2
    heuristic: A06
    passages:
      - "Непотрібні паперові службові документи працівник повертає до приміщень Організації для знищення й не викидає вдома."
    confidence: 0.35
    note: "Знищення повернутих паперових документів не покладено на жодну посаду чи підрозділ, хоча речення зобовʼязує лише працівника, а знищення названо як мету, а не як обовʼязок."
  - id: R-3
    heuristic: A03
    passages:
      - "Безпосередній керівник передає розглянуту заяву до відділу персоналу протягом одного робочого дня після рішення."
      - "Відділ інформаційних технологій видає працівникові ноутбук і гарнітуру до першого дня дистанційної роботи."
    confidence: 0.3
    note: "Відділ інформаційних технологій має строк, що залежить від погодження заяви, але Політика передає розглянуту заяву лише до відділу персоналу й мовчить про те, хто повідомляє про погодження відділ інформаційних технологій і працівника."
  - id: R-4
    heuristic: A05
    passages:
      - "Керівник відділу персоналу контролює дотримання цієї Політики та щокварталу подає директорові звіт про погоджені й відхилені заяви."
      - "Відділ персоналу перевіряє повідомлення й письмово підтверджує або спростовує порушення протягом пʼяти робочих днів."
    confidence: 0.3
    note: "Коли порушником є керівник відділу персоналу, порушення підтверджує або спростовує відділ, який він очолює, і винятку Політика не містить, хоча вона називає відділ, а не особу."
  - id: R-5
    heuristic: A03
    passages:
      - "Безпосередній керівник розглядає заяву протягом трьох робочих днів після дня подання та погоджує її або відхиляє."
      - "Працівник зазначає в заяві перший день періоду дистанційної роботи не раніше ніж через пʼять робочих днів після дня подання заяви."
    confidence: 0.25
    note: "Політика мовчить про заяву, щодо якої безпосередній керівник не ухвалив рішення до зазначеного в ній першого дня, хоча визначення вимагає погодженої заяви й тому схиляє до одного прочитання."
  - id: R-6
    heuristic: A02
    passages:
      - "Працівник, якого звільняють, повертає обладнання не пізніше останнього дня роботи в Організації замість пʼятиденного строку."
      - "Працівник не повертає обладнання, якщо до останнього дня дистанційної роботи безпосередній керівник погодив його нову заяву без перерви між періодами."
    confidence: 0.2
    note: "До працівника, якого звільняють і нову заяву якого вже погоджено, застосовні обидва правила без вказівки, котре з них діє, хоча на практиці жоден уважний читач не залишить йому обладнання."
  - id: R-7
    heuristic: A01
    passages:
      - "Політика поширюється на всіх працівників Організації, крім директора."
      - "Перелік посад складає керівник відділу персоналу, а затверджує директор."
      - "Безпосередній керівник у цій Політиці означає посадову особу, якій працівник підпорядкований згідно зі штатним розписом."
    confidence: 0.2
    note: "Політика не поширюється на директора, проте покладає на нього обовʼязки, зокрема обовʼязки безпосереднього керівника для підпорядкованих йому працівників, хоча природне прочитання лише виключає дистанційну роботу самого директора; це можна прочитати і як A01, і як A03."
  - id: R-8
    heuristic: A04
    passages:
      - "Основні години тривають з 10:00 до 15:00 за київським часом кожного дня дистанційної роботи."
      - "До отримання справного обладнання працівник працює в приміщеннях Організації."
      - "Безпосередній керівник веде облік днів дистанційної роботи й подає його до бухгалтерії до третього робочого дня наступного місяця."
    confidence: 0.2
    note: "«День дистанційної роботи» в розділі 4 означає день, зазначений у заяві, а в розділі 6 — день, фактично відпрацьований дистанційно, хоча слова «відпрацював дистанційно» в розділі 6 фіксують підрахунок і дії нікого не змінюють."
  - id: R-9
    heuristic: A02
    passages:
      - "Дистанційна робота такого працівника завершується на десятий робочий день після дня повідомлення."
    confidence: 0.25
    note: "Десятий робочий день можна прочитати як останній день дистанційної роботи або як перший день у приміщеннях Організації, і від цього залежить строк повернення обладнання в розділі 5, хоча речення неясне лише саме собою."
