  note: Правило про неоплачувану перерву стоїть у розділі про обідню перерву працівників загального режиму, а розділ про працівників зі скороченим робочим днем надає власну перерву й не повторює цього правила. Тому читач може застосувати «не оплачується» до кожної перерви в наказі або лише до перерви працівників загального режиму.
