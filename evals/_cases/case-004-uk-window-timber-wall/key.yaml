  note: "До монтажного зазору, який виходить за межі після встановлення коробки в проріз, застосовні два правила: один читач зупиняється й повідомляє керівника дільниці, інший послаблює кріплення та виправляє положення коробки, і документ не каже, яке правило має перевагу. Цей пункт послаблюють заголовок «Дії в разі відхилень прорізу» та слова «не встановлює вікно», які відносять перше правило до часу перед встановленням. Він також близький до A01-1, і багато читачів оцінили б його разом з ним. Залишити його в `residue` або прийняти як частину A01-1."
