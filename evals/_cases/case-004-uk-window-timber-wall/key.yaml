case: case-004-uk-window-timber-wall
language: uk
heuristics:
  A01:
    defects:
    - id: A01-1
      passages:
      - Виміряний монтажний зазор з кожного з чотирьох боків має бути від 8 до 14 мм включно.
      - Монтажний зазор з кожного боку та зверху становить від 15 до 25 мм включно.
      - Монтажний зазор знизу становить від 20 до 30 мм включно.
      - '- Поставити коробку в проріз так, щоб монтажний зазор відповідав розділу «Монтажний зазор».'
      note: "Розділ «Монтажний зазор» встановлює від 15 до 25 мм з кожного боку та зверху і від 20 до 30 мм знизу, а перша перевірка вимагає від 8 до 14 мм з кожного з чотирьох боків. Ці діапазони не перетинаються, тому монтажник, який поставив коробку за першою вимогою, не виконує другу, і за жодного прочитання обидві вимоги не виконуються разом."
    traps: []
  A02:
    defects:
    - id: A02-1
      passages:
      - Ці вимоги не застосовують до прорізу, який уже виправляли за рішенням керівника дільниці.
      - Якщо хоча б одна вимога розділів «Підготовка прорізу» або «Монтажний зазор» не виконана, монтажник не встановлює вікно і того самого дня повідомляє про це керівника дільниці.
      - Монтажник виправляє проріз за цим рішенням і повторює всі вимірювання розділів «Підготовка прорізу» та «Монтажний зазор».
      note: "«Ці вимоги» можуть означати обов’язки розділу «Дії в разі відхилень прорізу» або вимоги двох розділів, названих у його першому рядку. За першого прочитання межі й далі діють для виправленого прорізу, але монтажник не зобов’язаний ні зупинятися, ні повідомляти керівника дільниці. За другого прочитання межі для такого прорізу не діють, і монтажник встановлює вікно, хоч би що показали повторні вимірювання."
    traps: []
  A03:
    defects: []
    traps:
    - id: A03-T1
      passages:
      - За обох способів монтажник розміщує точки кріплення на бічних і верхній сторонах коробки на відстані від 150 до 180 мм від її кутів і з кроком не більше 700 мм.
      - Нижню сторону коробки монтажник не кріпить, а спирає на несучі колодки.
      why: "Точки кріплення названо лише для трьох сторін, і це схоже на прогалину щодо четвертої, але наступний рядок її закриває: «Нижню сторону коробки монтажник не кріпить»."
  A04:
    defects:
    - id: A04-1
      passages:
      - 'Бригадир протягом одного робочого дня після отримання акта виконує другу перевірку вікна на місці: звіряє розміри вікна з проєктом, а акт — з тим, що побачив.'
      - '- Виконати другу перевірку за розділом «Перевірка рівня та діагоналей».'
      - Якщо друга перевірка виявила перевищення, монтажник видаляє піну й повторює роботи, починаючи з кроку встановлення коробки в проріз.
      note: "«Друга перевірка» — це визначена перевірка рівня та діагоналей, яку монтажник виконує після піни, а бригадир на місці виконує «другу перевірку», у якій звіряє розміри вікна з проєктом і акт. Читач не може визначити, до якої з двох других перевірок належить перевищення, виявлене бригадиром, і чи повертає воно монтажника до видалення піни."
    traps: []
  A05:
    defects: []
    traps: []
  A06:
    defects: []
    traps: []
