      passages:
      - The content of the accounts is archived before the accounts are deleted.
      - The IT Technician disables the accounts at the end of the leaving day and deletes them 30 calendar days later.
      note: The archiving of the accounts' content is required in the passive and no role is assigned to it anywhere in the document, since the IT Technician's line names only disabling and deleting.
