      - Комірник присутній під час підрахунку й показує комісії місця зберігання товарів.
      note: "Порядок поширюється й на товари торгового залу, але єдині правила, що зупиняють рух товарів і показують комісії, де вони зберігаються, стосуються комірника та складу. Тому жодне правило не каже, чи припиняється продаж у торговому залі на час підрахунку і хто показує комісії товари торгового залу."
