      why: "Товар, який голова комісії перерахував через незбіг результатів членів комісії і кількість якого потім не збіглася з витягом, підпадає під обидва правила перерахунку, але розділ 6 виключає його словами «крім товару, який він уже перерахував за розділом 5» і відносить його розбіжність до переліку розбіжностей, тож документ сам каже, яке правило діє."
