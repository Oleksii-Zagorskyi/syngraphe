      - Бухгалтер відповідає перед головним бухгалтером за правильність і своєчасність записів, звірянь та звіту.
      note: Документ визначає «звіт» як щомісячний звіт про стан розрахунків, а потім вживає це слово для щоквартального звіту про виконання бухгалтером своїх обов'язків. Тому слово «звіту» без уточнення в рядку про відповідальність охоплює або лише щомісячний звіт, або обидва звіти.
