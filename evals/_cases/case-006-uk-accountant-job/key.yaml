      why: 'Повідомлення про розбіжність сформульовано безособово, але розділ «Відповідальність» покладає саму дію на бухгалтера: «Бухгалтер письмово повідомляє головного бухгалтера про кожну розбіжність», тож обов''язок має виконавця.'
