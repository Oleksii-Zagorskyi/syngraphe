case: case-016-uk-db-backup
language: uk
heuristics:
  A01:
    defects:
    - id: A01-1
      passages:
      - Щотижнева копія зберігається на сервері резервних копій і у віддаленому сховищі 12 місяців від дня створення.
      - У віддаленому сховищі щотижнева копія зберігається шість місяців від дня створення.
      note: Один рядок встановлює для щотижневої копії у віддаленому сховищі строк зберігання дванадцять місяців, а інший — шість місяців, і за жодного прочитання обидва рядки не є істинними одночасно.
    traps: []
  A02:
    defects:
    - id: A02-1
      passages:
      - Системний адміністратор, який виконує обов’язки відсутнього адміністратора баз даних, не виконує пробного відновлення.
      - У разі відсутності адміністратора баз даних його обов’язки за цією Інструкцією виконує системний адміністратор.
      - Системний адміністратор протягом перших десяти календарних днів кожного місяця відновлює базу даних з останньої щотижневої копії, яка пройшла перевірку.
      note: Поки адміністратор баз даних відсутній, його обов’язки виконує системний адміністратор, і він не виконує пробного відновлення. Один читач відносить заборону лише до відновлення, яке припадає йому як виконавцеві обов’язків відсутнього, тож своє щомісячне відновлення він і далі виконує; інший відносить заборону до будь-якого відновлення, тож того місяця відновлення не виконується взагалі.
    traps: []
  A03:
    defects:
    - id: A03-1
      passages:
      - Щотижнева копія зберігається на сервері резервних копій і у віддаленому сховищі 12 місяців від дня створення.
      - Адміністратор баз даних видаляє резервну копію з сервера резервних копій наступного робочого дня після закінчення строку її зберігання.
      also:
      - A06
      note: Інструкція встановлює строк зберігання для віддаленого сховища, а видалення стосується лише сервера резервних копій, тому жодне правило не визначає, що відбувається зі щотижневою копією у віддаленому сховищі після закінчення строку її зберігання та хто її видаляє.
    traps: []
  A04:
    defects: []
    traps:
    - id: A04-T1
      passages:
      - Щоденна копія — це резервна копія, створена з понеділка до суботи.
      - Вид резервної копії визначає лише день її створення, також для копії, створеної вручну чи позачергово.
      - Того самого дня адміністратор баз даних запускає завдання вручну і перевіряє створену копію способом, описаним у розділі 5.
      why: Копія, створена вручну після збою, на перший погляд не є ні щоденною копією за розкладом, ні щотижневою, проте визначення встановлює її вид лише за днем створення, тож кожен термін зберігає одне значення.
  A05:
    defects: []
    traps:
    - id: A05-T1
      passages:
      - Адміністратор баз даних налаштовує це завдання та підтримує його в робочому стані.
      - Системний адміністратор протягом перших десяти календарних днів кожного місяця відновлює базу даних з останньої щотижневої копії, яка пройшла перевірку.
      - Головний бухгалтер протягом двох робочих днів після відновлення звіряє залишки на рахунках у відновленій базі даних із залишками в бухгалтерській базі даних на дату створення копії.
      why: Резервні копії належать до обов’язків адміністратора баз даних, і здається, що він перевіряє сам себе, проте пробне відновлення виконує системний адміністратор, а залишки звіряє головний бухгалтер, тож той, хто створює копії, не випробовує їх сам.
  A06:
    defects: []
    traps: []
residue:
- id: R-1
  heuristic: A02
  passages:
  - Адміністратор баз даних перевіряє кожну резервну копію до 10:00 наступного робочого дня після її створення.
  - У такому разі адміністратор баз даних того самого дня створює позачергову резервну копію і перевіряє її згідно з розділом 5.
  - Системний адміністратор протягом трьох робочих днів повторює пробне відновлення з позачергової копії.
  confidence: 0.5
  note: Слова «того самого дня» можуть стосуватися і створення, і перевірки позачергової копії або лише створення, і тоді перевірку слід виконати до 10:00 наступного робочого дня згідно з розділом 5.
- id: R-2
  heuristic: A03
  passages:
  - Головний бухгалтер протягом двох робочих днів після відновлення звіряє залишки на рахунках у відновленій базі даних із залишками в бухгалтерській базі даних на дату створення копії.
  - Якщо відновлення не вдалося або залишки не збіглися, системний адміністратор того самого робочого дня повідомляє про це керівника відділу інформаційних технологій та адміністратора баз даних.
  confidence: 0.2
  note: Розбіжність залишків виявляє головний бухгалтер, а повідомити про неї того самого робочого дня мусить системний адміністратор, і жоден крок не передає результат від першого до другого.
- id: R-4
  heuristic: A05
  passages:
  - У разі відсутності адміністратора баз даних його обов’язки за цією Інструкцією виконує системний адміністратор.
  - Адміністратор баз даних перевіряє кожну резервну копію до 10:00 наступного робочого дня після її створення.
  - Системний адміністратор протягом перших десяти календарних днів кожного місяця відновлює базу даних з останньої щотижневої копії, яка пройшла перевірку.
  confidence: 0.25
  note: 'За тим прочитанням A02-1, яке відносить заборону лише до обов’язків відсутнього, системний адміністратор перевіряє копії як виконавець обов’язків відсутнього, а потім відновлює з них базу даних у межах власного обов’язку. Оцінюю це низько: головний бухгалтер усе одно звіряє залишки, а інше прочитання A02-1 знімає це питання. Модель, яка про це повідомить, буде оцінена як така, що потрапила в пастку A05, тому «why» цієї пастки має називати випадок відсутності.'
- id: R-5
  heuristic: A01
  passages:
  - Збій — це випадок, коли резервну копію не створено або вона не пройшла перевірку, описану в розділі 5.
  - Того самого дня адміністратор баз даних запускає завдання вручну і перевіряє створену копію способом, описаним у розділі 5.
  - В іншому разі адміністратор баз даних не запускає завдання повторно і до кінця того самого робочого дня повідомляє керівника відділу інформаційних технологій.
  confidence: 0.2
  note: Копія, створена вручну, яка не пройшла перевірку, описану в розділі 5, відповідає визначенню збою, для якого розділ 8 приписує запуск завдання вручну, а третій рядок цей запуск забороняє. Більшість читачів вважає третій рядок спеціальним правилом, яке має перевагу, тому оцінюю це низько; відкритим залишається питання, чи другий збій отримує окремий запис у журналі резервного копіювання.
- id: R-6
  heuristic: A03
  passages:
  - У разі відсутності системного адміністратора, обох цих працівників одночасно або іншої особи, названої в цій Інструкції, обов’язки відсутніх за цією Інструкцією виконує працівник, якого директор призначає наказом.
  - Директор протягом двох робочих днів після доповіді ухвалює письмове рішення про подальші дії.
  - Системний адміністратор протягом трьох робочих днів повторює пробне відновлення з позачергової копії.
  confidence: 0.15
  note: Директор є особою, названою в цій Інструкції, тому працівника, який виконує обов’язки відсутнього директора, призначає сам директор. Директор може видати наказ до початку своєї відсутності, тому зауваження слабке.
