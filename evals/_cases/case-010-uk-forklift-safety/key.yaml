  note: "Працівник, у якого сьогодні вранці закінчився строк дії висновку медичного огляду, залишається допущеним за наказом, доки начальник складу не скасує допуск «того самого дня»; один читач керує навантажувачем, доки не видано наказ, інший припиняє, щойно умова перестала виконуватися. Прочитання, за яким працівник допущений, доки допуск не скасовано, є сильнішим, тому я ставлю цьому пункту низьку впевненість. Якщо авторові цей пункт не потрібен, досить примітки в залишку."
