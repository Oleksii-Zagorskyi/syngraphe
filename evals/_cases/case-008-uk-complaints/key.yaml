case: case-008-uk-complaints
language: uk
heuristics:
  A01:
    defects:
    - id: A01-1
      passages:
      - Оператор знищує скарги та висновки через два роки від дня реєстрації скарги.
      - Оператор зберігає скаргу, висновок і копію відповіді три роки від дня реєстрації скарги.
      note: "Оператор мусить знищити скаргу та висновок щодо неї через два роки від дня реєстрації і мусить зберігати їх три роки від того самого дня. За жодного прочитання обидві вимоги не виконуються водночас."
    traps: []
  A02:
    defects:
    - id: A02-1
      passages:
      - Ці строки не застосовують до скарги, що надійшла поштою.
      - Не пізніше кінця сьомого робочого дня строку фахівець подає керівникові відділу висновок і проєкт відповіді.
      - Оператор надсилає відповідь клієнтові не пізніше десятого робочого дня строку.
      note: "«Ці строки» — це або лише строки розслідування, і тоді на скаргу, що надійшла поштою, однаково відповідають не пізніше десятого робочого дня строку, або всі встановлені досі строки разом зі строком відповіді, і тоді для скарги, що надійшла поштою, немає жодного строку. Тож фахівець і оператор діють у різні дати."
    traps:
    - id: A02-T1
      passages:
      - У день реєстрації оператор передає скаргу керівникові відділу, крім скарг, щодо яких розділ «Ескалація» встановлює інше.
      - Оператор ескалює скаргу в день реєстрації в кожному з трьох випадків.
      why: "Два правила визначають, кому передати скаргу в день реєстрації, але перше називає виняток словом «крім», тож документ сам указує, яке правило застосовувати, і прочитання одне."
  A03:
    defects: []
    traps: []
  A04:
    defects: []
    traps: []
  A05:
    defects: []
    traps:
    - id: A05-T1
      passages:
      - '- Скарга стосується дій керівника відділу.'
      - Замість ескалації оператор у день реєстрації передає скаргу заступникові керівника Організації, далі — заступник, якщо вона стосується дій керівника департаменту або клієнт оскаржує відповідь, яку підписав керівник департаменту.
      why: "Скарга на дії керівника виглядає так, ніби її розглядає він сам, але кожна така скарга йде до посадової особи, вищої за цього керівника (керівник департаменту над керівником відділу, заступник над керівником департаменту), тож ніхто не ухвалює рішення щодо власних дій."
  A06:
    defects:
    - id: A06-1
      passages:
      - Щокварталу для керівника Організації складається аналіз скарг за видами та строками розгляду.
      - Оператор веде журнал скарг в електронній формі.
      note: "Вимогу складати щоквартальний аналіз скарг сформульовано в пасиві, і складати його не доручено нікому. Оператор веде журнал скарг, але ніщо не зобовʼязує оператора складати аналіз."
    traps: []
residue:
- id: R-1
  heuristic: A02
  passages:
  - Керівник відділу протягом одного робочого дня після дня отримання висновку і проєкту відповіді затверджує висновок і підписує відповідь або повертає їх фахівцеві із зауваженнями.
  - Якщо контактних даних немає, фахівець подає лише висновок, керівник відділу лише затверджує його, а оператор записує рішення в журнал скарг.
  confidence: 0.3
  note: "«лише затверджує його» може означати, що керівник відділу нічого не підписує, але все ще може повернути висновок, або що права повернути його він не має. Паралельне «подає лише висновок» робить перше прочитання природним."
- id: R-2
  heuristic: A03
  passages:
  - Скарга надходить одним із чотирьох каналів.
  - Працівник Організації, який отримав скаргу в інший спосіб, не пізніше наступного робочого дня пересилає її на електронну адресу для скарг.
  - Днем надходження є робочий день, коли скарга надійшла одним із каналів, а якщо вона надійшла в неробочий день — перший робочий день після нього.
  confidence: 0.25
  note: "Скарга, отримана «в інший спосіб», не надходить жодним із каналів так, як їх сформульовано в переліку (у кожному діє клієнт), тож день її надходження, а з ним і строк реєстрації, не визначено. Природне прочитання таке: переслане повідомлення надходить каналом електронної адреси для скарг у день, коли його переслано, і тому впевненість низька."
- id: R-3
  heuristic: A02
  passages:
  - Протягом одного робочого дня після дня реєстрації оператор надсилає клієнтові підтвердження з номером скарги й останнім днем строку відповіді на електронну адресу, а якщо її немає — на поштову.
  - Скаргу клієнта на остаточну відповідь оператор реєструє, не ескалює й нікому не передає, хоч би якого випадку з цього розділу вона стосувалася, і, якщо контактні дані є, не пізніше десятого робочого дня строку повідомляє клієнта, що розгляд завершено.
  confidence: 0.2
  note: "Один читач надсилає підтвердження з останнім днем строку відповіді, якої ніколи не буде, а потім повідомлення. Інший читає другий рядок як увесь порядок дій щодо такої скарги й надсилає лише повідомлення. Правило про реєстрацію рядком раніше каже «кожну скаргу», і ніщо його не скасовує, тож перше прочитання значно сильніше."
- id: R-4
  heuristic: A01
  passages:
  - Відповідь містить рішення щодо скарги, його підстави і пояснення, як оскаржити відповідь.
  - Відповідь, яку підписав заступник, є остаточною.
  confidence: 0.2
  note: "Відповідь заступника має пояснювати клієнтові, як її оскаржити, а скаргу на неї не розглядають. Є прочитання, яке їх узгоджує (пояснення повідомляє, що відповідь остаточна, або вказує на оскарження поза Організацією), тож найімовірніше це не A01."
- id: R-5
  heuristic: A05
  passages:
  - Фахівцем не може бути працівник, дій якого стосується скарга.
  - '- Клієнт оскаржує відповідь, яку підписав керівник відділу.'
  confidence: 0.15
  note: "Коли клієнт оскаржує відповідь, керівник департаменту може призначити того фахівця, який склав висновок і проєкт цієї відповіді, і тоді фахівець розслідує власну роботу. Перший рядок виключає цього фахівця, якщо проєкт належить до «дій», і фахівець не ухвалює рішення, тож зауваження слабке."
