case: adv-001-en-visitor-access
language: en
heuristics:
  A01:
    defects:
      - id: A01-1
        passages:
          - "The Host Employee completes the registration at least one hour before the Visitor is given a Visitor Badge."
          - "If the registration was completed less than one hour before that moment, the Receptionist asks the Visitor to wait in the reception area and issues the Visitor Badge when the hour has passed."
          - "A registration completed at least 30 minutes before the Visitor arrives is enough for the Receptionist to issue the Visitor Badge at once."
        note: "A Visitor whose registration was completed 40 minutes before the arrival gets a Visitor Badge at once by the 30-minute line and must wait until the hour has passed by the two one-hour lines, so the Receptionist cannot obey both."
    traps: []
  A02: {defects: [], traps: []}
  A03: {defects: [], traps: []}
  A04:
    defects:
      - id: A04-1
        passages:
          - "\"Host Employee\" means the one employee who is named in the Visitor Register as responsible for a Visitor on the day of the visit."
          - "The Receptionist opens the access gates for a Visitor only when the Visitor wears a Visitor Badge and the Host Employee has come to the reception desk."
          - "When the Host Employee is a team, any member of that team may accompany the Visitor."
        also: [A01, A02]
        note: "\"Host Employee\" is defined as the one employee named in the Visitor Register and is then used for a team, so a Receptionist cannot tell whether any member of the team who comes to the reception desk opens the access gates or only the named employee."
    traps: []
  A05: {defects: [], traps: []}
  A06: {defects: [], traps: []}
residue:
  - id: R-1
    heuristic: A02
    passages:
      - "\"Visitor Register\" means the electronic record of Visitors, which records the time of each registration automatically."
      - "The Host Employee completes the registration at least one hour before the Visitor is given a Visitor Badge."
      - "A Host Employee who cannot be at the Premises on the date of the visit names another employee in the registration, with that employee's agreement, before the Visitor arrives."
      - "If the registration was completed one hour or more before that moment, the Receptionist records the arrival time, issues a Visitor Badge and calls the Host Employee by telephone."
    confidence: 0.4
    note: "The document allows a change of Host Employee up to the arrival and does not say whether the changed registration was completed at the first entry or at the change, so one Receptionist issues the Visitor Badge at once and another makes the Visitor wait."
  - id: R-2
    heuristic: A02
    passages:
      - "Any employee who meets a Visitor without the Host Employee accompanies that Visitor to the reception desk and informs the Receptionist."
      - "The Receptionist then treats that Visitor as an arriving Visitor under Section 4 and informs the Security Officer on the same day."
      - "If the registration was completed one hour or more before that moment, the Receptionist records the arrival time, issues a Visitor Badge and calls the Host Employee by telephone."
    confidence: 0.3
    note: "Section 4 tells the Receptionist to record an arrival time and issue a Visitor Badge, but a Visitor found without the Host Employee already has both, so one Receptionist issues a second badge and another only calls the Host Employee."
  - id: R-3
    heuristic: A06
    passages:
      - "The Receptionist asks that person to wait in the reception area or to leave the building."
      - "An employee may then register that person under Section 3."
    confidence: 0.3
    note: "The person who waits depends on a registration that any employee may make and no role must make or refuse, and the wait has no end, although the refusal itself is a complete outcome."
  - id: R-4
    heuristic: A01
    passages:
      - "The Receptionist admits Visitors only during those hours."
      - "If the registration was completed less than one hour before that moment, the Receptionist asks the Visitor to wait in the reception area and issues the Visitor Badge when the hour has passed."
      - "The Host Employee ensures that the Visitor leaves the Premises no later than 19:00 on the day of the visit."
    confidence: 0.2
    note: "For a registration completed after 18:00 the Receptionist is told to issue a Visitor Badge after 19:00, when admission is forbidden and the Visitor must be gone, though issuing a badge is not the same act as admitting."
  - id: R-5
    heuristic: A03
    passages:
      - "A Host Employee who cannot be at the Premises on the date of the visit names another employee in the registration, with that employee's agreement, before the Visitor arrives."
      - "A Host Employee who must leave the Visitor first brings the Visitor back to the reception area."
    confidence: 0.2
    note: "A replacement can be named only before the arrival, so for a Host Employee who leaves for the rest of the day after the arrival the document gives the Visitor no way back in and names nobody who ends the visit and collects the Visitor Badge."
  - id: R-6
    heuristic: A03
    passages:
      - "A Host Employee who cannot be at the Premises on the date of the visit names another employee in the registration, with that employee's agreement, before the Visitor arrives."
      - "An employee does not act as a Host Employee while that employee is on duty as the Receptionist."
    confidence: 0.15
    note: "The replacement rule covers only absence from the Premises, and the document is silent for an employee who registered a Visitor and is then on duty as the Receptionist at the time of the visit."
