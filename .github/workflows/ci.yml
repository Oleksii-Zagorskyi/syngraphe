name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: syngraphe
          POSTGRES_PASSWORD: syngraphe
          POSTGRES_DB: syngraphe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: syngraphe_test
      POSTGRES_USER: syngraphe
      POSTGRES_PASSWORD: syngraphe
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost

    steps:
      - uses: actions/checkout@v4

      # Until the first code lands (Epic 2, Story 1) there is no package to
      # install, so every later step is skipped and the run passes. The gate
      # is a step because hashFiles() is not available in a job-level `if`.
      - name: Is there code to check?
        id: code
        run: echo "present=${{ hashFiles('pyproject.toml') != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.code.outputs.present == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        if: steps.code.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        if: steps.code.outputs.present == 'true'
        run: ruff check .

      - name: Format
        if: steps.code.outputs.present == 'true'
        run: ruff format --check .

      - name: Types
        if: steps.code.outputs.present == 'true'
        run: mypy src

      - name: Tests
        if: steps.code.outputs.present == 'true'
        run: pytest -q
