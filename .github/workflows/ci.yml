name: CI

# Every push to every branch, and so the merge commit on main; a pull request
# shows its branch's latest run, so the pull_request trigger would run each
# push twice.
on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: syngraphe
          POSTGRES_PASSWORD: syngraphe
          POSTGRES_DB: syngraphe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: syngraphe_test
      POSTGRES_USER: syngraphe
      POSTGRES_PASSWORD: syngraphe
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: 'false'
      DJANGO_ADMIN_PATH: operator/
      SITE_HTTPS: 'false'
      TRUSTED_PROXIES: none
      GIT_REPO_ROOT: /tmp/repos
      DISPLAY_TIMEZONE: UTC
      DEFAULT_LANGUAGE: uk
      MAIL_PASSWORD_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # The current 3.12 that uv manages, as the image's is, never the runner's older
      # system build: the standard library's email parser differs between them.
      UV_PYTHON_PREFERENCE: only-managed

    steps:
      - uses: actions/checkout@v4

      # GNU gettext, whose xgettext the catalogue test's makemessages runs, and
      # weasyprint's Pango and HarfBuzz with the fonts the image carries, for the PDF
      # exports.
      - name: System packages
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends
          gettext fontconfig fonts-dejavu-core fonts-dejavu-extra
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The setup line of CLAUDE.md § Commands, as a developer runs it.
      - name: Install
        run: uv sync --locked && npm ci && npm run build && uv run playwright install chromium

      # The test database server keeps nothing a crash must not lose, as the developer
      # override's `test-db`; a service container takes no server arguments.
      - name: Test database settings
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U syngraphe -d syngraphe_test
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      # The system libraries Chromium needs, which the runner image lacks.
      - name: Browser system libraries
        run: uv run playwright install-deps chromium

      # Each check runs whatever an earlier one reported, so one run shows every failure.
      - name: Lint
        if: ${{ !cancelled() }}
        run: uv run ruff check .

      - name: Format
        if: ${{ !cancelled() }}
        run: uv run ruff format --check .

      - name: Types
        if: ${{ !cancelled() }}
        run: uv run mypy src

      # Every test but the timing budgets, on one worker per core.
      - name: Tests
        if: ${{ !cancelled() }}
        run: uv run pytest -q -n auto -m "not budget"

      # The timing budgets alone: beside the workers they measure the load. Each one's time is
      # printed, so its margin on the runner shows on a green run, not only on a red one.
      - name: Timing budgets
        if: ${{ !cancelled() }}
        run: uv run pytest -q -m budget --durations=0
