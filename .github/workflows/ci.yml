name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: syngraphe
          POSTGRES_PASSWORD: syngraphe
          POSTGRES_DB: syngraphe_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: syngraphe_test
      POSTGRES_USER: syngraphe
      POSTGRES_PASSWORD: syngraphe
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: 'false'
      DJANGO_ADMIN_PATH: operator/
      SITE_HTTPS: 'false'
      TRUSTED_PROXIES: none
      GIT_REPO_ROOT: /tmp/repos
      DISPLAY_TIMEZONE: UTC
      DEFAULT_LANGUAGE: uk

    steps:
      - uses: actions/checkout@v4

      # GNU gettext, whose xgettext the catalogue test's makemessages runs; the
      # runner image has none.
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gettext

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

      - name: Tests
        run: uv run pytest -q
