{% load i18n %}<nav class="outline" id="outline-pane" aria-label="{% translate 'Outline' %}">
      <div class="pane-head"><span>{% translate "Outline" %}</span><button type="button" class="icon" data-pane-toggle="outline-pane" aria-expanded="true" aria-label="{% translate 'Collapse the outline' %}">⇤</button></div>
      {% if headings %}<ul>{% include "rendering/outline.html" %}</ul>{% else %}<p class="muted">{% translate "No headings" %}</p>{% endif %}
    </nav>
    <div class="edge" role="separator" aria-orientation="vertical" data-drag="--outline-width" data-pane="outline-pane" data-min="{{ outline_bounds.0 }}" data-max="{{ outline_bounds.1 }}" data-keep="/preferences/outline-width/"></div>
