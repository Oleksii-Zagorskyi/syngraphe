{% extends "documents/page.html" %}
{% load i18n %}
{% block tab %}
<p class="held" role="status">{{ reason }}</p>
{% if refusals %}<ul class="refusals">{% for line in refusals %}<li>{{ line }}</li>{% endfor %}</ul>
<p><a href="/help/markdown/">{% translate "What the editor accepts" %}</a></p>{% endif %}
<p><a class="btn" href="/document/{{ document.number }}/edit/">{% translate "Continue editing" %}</a></p>
{% endblock %}
