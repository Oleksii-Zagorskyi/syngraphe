{% load i18n %}
<div id="member-groups">
  <h2>{% translate "Groups" %}</h2>
  <ul>
    {% for group in groups %}
    <li data-group="{{ group.id }}">
      <span>{{ group.name }}</span>
      <form method="post" action="{{ member_url }}groups/" hx-post="{{ member_url }}groups/" hx-target="#member-groups" hx-swap="outerHTML" class="inline">{% csrf_token %}
        <input type="hidden" name="group" value="{{ group.id }}">
        <input type="hidden" name="action" value="remove">
        <button class="btn" type="submit">{% translate "Remove" %}</button>
      </form>
    </li>
    {% empty %}
    <li class="muted">{% translate "No groups yet." %}</li>
    {% endfor %}
  </ul>
  {% if candidates %}
  <form method="post" action="{{ member_url }}groups/" hx-post="{{ member_url }}groups/" hx-target="#member-groups" hx-swap="outerHTML" class="toolbar" data-act="add">{% csrf_token %}
    <input type="hidden" name="action" value="add">
    <select name="group">
      {% for group in candidates %}<option value="{{ group.id }}">{{ group.name }}</option>{% endfor %}
    </select>
    <button class="btn" type="submit">{% translate "Add" %}</button>
  </form>
  {% endif %}
</div>
