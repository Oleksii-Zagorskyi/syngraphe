{% extends "documents/page.html" %}
{% load i18n %}
{% block body %}
<div class="make-canonical-confirm">
  <h2>{% translate "Make canonical" %}</h2>
  {% include "editions/approve_sentence.html" %}
  <form method="post" action="/document/{{ document.number }}/make-canonical/">
    {% csrf_token %}
    <input type="hidden" name="confirmed" value="{{ confirmed }}">
    <p class="choice"><button class="btn primary" type="submit" data-command="make-canonical">{% blocktranslate with number=number %}Make canonical as {{ number }}{% endblocktranslate %}</button>
    <a class="btn" href="/document/{{ document.number }}/">{% translate "Cancel" %}</a></p>
  </form>
</div>
{% endblock %}
