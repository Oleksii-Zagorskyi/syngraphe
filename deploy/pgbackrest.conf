# What does not change between installations; the store, its path and its keys are written to
# conf.d/store.conf from `.env` by backup-env.sh.
[global]
archive-async=y
spool-path=/var/spool/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
start-fast=y
log-level-console=info
log-level-file=off

[syngraphe]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
