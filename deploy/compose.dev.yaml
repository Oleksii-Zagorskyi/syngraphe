# The developer's override, for a workstation only: it turns debug on and publishes the database
# and Redis on the loopback without authentication, so it never runs on a host with a reverse
# proxy in front; and it adds the test suite's own database server, `test-db`.
# docker compose -f compose.yaml -f deploy/compose.dev.yaml up

services:
  web:
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_DEBUG: "true"
    volumes:
      - ./src:/app/src

  worker:
    volumes:
      - ./src:/app/src

  render:
    volumes:
      - ./src:/app/src

  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  # The test suite's database server, beside the stack's: it archives nothing, so a test run never
  # reaches the backup store, and it keeps nothing a crash must not lose.
  test-db:
    image: postgres:16
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - pgtest:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgtest:
