# The base stack: `web` on the loopback behind the host's own reverse proxy, the database on a
# named volume, its archive and the repositories' bundles copied to the backup store `.env` names,
# and `render` making exports on a network with no way out (ADR-0013).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile
  image: syngraphe:local
  environment: &app-environment
    # What the application reads of `.env`, and nothing else of it.
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    DJANGO_ADMIN_PATH: ${DJANGO_ADMIN_PATH:-}
    SITE_HTTPS: ${SITE_HTTPS:-true}
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    POSTGRES_DB: ${POSTGRES_DB:-}
    POSTGRES_USER: ${POSTGRES_USER:-}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-}
    DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-}
    BACKUP_WAL_ALERT: ${BACKUP_WAL_ALERT:-2GiB}
    BACKUP_LOCK_TIMEOUT: ${BACKUP_LOCK_TIMEOUT:-30}
    HELP_WORK_IN_PROGRESS: ${HELP_WORK_IN_PROGRESS:-false}
    # The stack's own wiring: the service names, whatever `.env` holds for a process on the host.
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    GIT_REPO_ROOT: /srv/repos
    EXPORT_ROOT: /srv/exports
  volumes:
    - ${GIT_REPO_ROOT_HOST:-./.repos}:/srv/repos
    - backup-state:/srv/backup-state:ro
  restart: unless-stopped
  logging: *logging

# What `db` and `backup` need of `.env`, and nothing else of it.
x-backup-environment: &backup-environment
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  BACKUP_TARGET: ${BACKUP_TARGET:-}
  BACKUP_SFTP_HOST: ${BACKUP_SFTP_HOST:-}
  BACKUP_SFTP_PORT: ${BACKUP_SFTP_PORT:-22}
  BACKUP_SFTP_USER: ${BACKUP_SFTP_USER:-}
  BACKUP_SFTP_PATH: ${BACKUP_SFTP_PATH:-}
  BACKUP_SFTP_KNOWN_HOSTS: ${BACKUP_SFTP_KNOWN_HOSTS:-}
  BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
  BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
  BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
  BACKUP_S3_PATH: ${BACKUP_S3_PATH:-}
  BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
  BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
  BACKUP_DB_CIPHER_PASS: ${BACKUP_DB_CIPHER_PASS:-}
  BACKUP_WAL_QUEUE_MAX: ${BACKUP_WAL_QUEUE_MAX:-10GiB}

x-db-image: &db-image
  build:
    context: .
    dockerfile: deploy/Dockerfile.db
  image: syngraphe-db:local

services:
  web:
    <<: *app
    environment:
      <<: *app-environment
      # The sending passwords' key: web encrypts, worker decrypts; render holds neither.
      MAIL_PASSWORD_KEY: ${MAIL_PASSWORD_KEY:-}
      MAIL_PASSWORD_KEY_PREVIOUS: ${MAIL_PASSWORD_KEY_PREVIOUS:-}
    volumes:
      - ${GIT_REPO_ROOT_HOST:-./.repos}:/srv/repos
      - backup-state:/srv/backup-state:ro
      # The exports `render` wrote, served as downloads.
      - exports:/srv/exports:ro
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *app
    # Beat runs inside the worker; its schedule file is state it rebuilds, kept out of the source tree.
    entrypoint: ["celery", "-A", "syngraphe", "worker", "-B", "--schedule=/tmp/celerybeat-schedule", "--loglevel=info"]
    environment:
      <<: *app-environment
      # The bundles' store and their key: the worker's alone. The database archive's key is not here.
      BACKUP_TARGET: ${BACKUP_TARGET:-}
      BACKUP_SFTP_HOST: ${BACKUP_SFTP_HOST:-}
      BACKUP_SFTP_PORT: ${BACKUP_SFTP_PORT:-22}
      BACKUP_SFTP_USER: ${BACKUP_SFTP_USER:-}
      BACKUP_SFTP_PATH: ${BACKUP_SFTP_PATH:-}
      BACKUP_SFTP_KNOWN_HOSTS: ${BACKUP_SFTP_KNOWN_HOSTS:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_PATH: ${BACKUP_S3_PATH:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_BUNDLE_CRYPT_PASSWORD: ${BACKUP_BUNDLE_CRYPT_PASSWORD:-}
      # The sending passwords' key, as on web.
      MAIL_PASSWORD_KEY: ${MAIL_PASSWORD_KEY:-}
      MAIL_PASSWORD_KEY_PREVIOUS: ${MAIL_PASSWORD_KEY_PREVIOUS:-}
    volumes:
      - ${GIT_REPO_ROOT_HOST:-./.repos}:/srv/repos
      - backup-state:/srv/backup-state
      - ${BACKUP_KEY_FILE:?name the backup store's private key in .env}:/run/backup/key:ro
    extra_hosts:
      - ${BACKUP_EXTRA_HOST:-backup-store.invalid:127.0.0.1}
    depends_on:
      web:
        condition: service_healthy
      backup:
        condition: service_started

  # Exports: PDF, DOCX and Markdown from the repositories, on the `render` queue. Its only network
  # is internal — the database and Redis beside it, nothing beyond — so a renderer that tried to
  # fetch a remote reference could not reach it even past the fetcher's refusal.
  render:
    <<: *app
    # Two renders at a time, each process renewed after fifty: a layout engine's memory is
    # returned, and one large document cannot hold every slot.
    entrypoint:
      - celery
      - -A
      - syngraphe
      - worker
      - -Q
      - render
      - --concurrency=2
      - --max-tasks-per-child=50
      - --loglevel=info
    volumes:
      - ${GIT_REPO_ROOT_HOST:-./.repos}:/srv/repos:ro
      - exports:/srv/exports
    networks:
      - render
    depends_on:
      web:
        condition: service_healthy

  db:
    <<: *db-image
    # The log is archived by pgBackRest, asynchronously; a quiet segment is closed within five
    # minutes. The entrypoint refuses to start with an unset credential.
    entrypoint: ["db-entrypoint.sh"]
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=syngraphe archive-push %p
      - -c
      - archive_timeout=300
    environment: *backup-environment
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
      - pgspool:/var/spool/pgbackrest
      - ${BACKUP_KEY_FILE:?name the backup store's private key in .env}:/run/backup/key.src:ro
    extra_hosts:
      - ${BACKUP_EXTRA_HOST:-backup-store.invalid:127.0.0.1}
    networks:
      - default
      - render
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  backup:
    <<: *db-image
    # The nightly base backup and the state the worker reads; it reaches the database through the
    # shared socket and reads its data directory without writing to it.
    entrypoint: ["backup-entrypoint.sh"]
    environment:
      <<: *backup-environment
      BACKUP_STATE_DIR: /srv/backup-state
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgsocket:/var/run/postgresql
      - backup-state:/srv/backup-state
      - ${BACKUP_KEY_FILE:?name the backup store's private key in .env}:/run/backup/key.src:ro
    extra_hosts:
      - ${BACKUP_EXTRA_HOST:-backup-store.invalid:127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - default
      - render
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  pgsocket:
  pgspool:
  backup-state:
  exports:

networks:
  default:
  render:
    internal: true
